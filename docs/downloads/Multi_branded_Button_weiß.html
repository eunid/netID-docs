<button class="wmg-action-button" onclick="alert('Button geklickt!')">
  <style>
    .wmg-action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      border: 1px solid #878786;
      border-radius: 8px;
      padding: 10px 20px;
      height: 42px;
      box-sizing: border-box;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 280px;
      max-width: 100%;
    }

    .wmg-action-button:hover {
      background-color: #f9f9f9;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* SVG-Styling innerhalb des Buttons */
    .wmg-action-button svg {
      height: 100%      
      width: 100%;
      object-fit: contain;
      pointer-events: none; /* Verhindert Klick-Probleme auf dem Icon */    }

    /* Responsivität für verschiedene Bildschirmgrößen */
    @media (min-width: 768px) {
      .wmg-action-button {
        padding: 12px 25px;
      }
    }
  </style>
