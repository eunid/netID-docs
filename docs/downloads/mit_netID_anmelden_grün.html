<button type="button" class="netid-button" onclick="alert('Login-Aktion gestartet!')">
    <style>
        .netid-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            /* Hintergrundfarbe auf netID-Grün gesetzt */
            background-color: #76B82A;
            /* Dezente grüne Umrandung, passend zum Hintergrund */
            border: 1px solid #6aa626;
            border-radius: 6px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'IBM Plex Sans', Verdana, Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            /* Textfarbe auf Weiß gesetzt */
            color: #ffffff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .netid-button:hover {
            /* Etwas dunklerer Grünton für den Hover-Effekt */
            background-color: #6aa626;
            border-color: #5e9422;
        }

        .netid-button svg {
            display: block;
            /* Icon-Farbe wird vom umgebenden Text-Color geerbt (currentColor) */
            fill: currentColor;
        }

        /* Responsivität für mobile Geräte */
        @media (max-width: 480px) {
            .netid-button {
                width: 100%;
                padding: 12px 16px;
            }
        }
    </style>

    <!-- Icon-SVG (Farbe wird durch CSS 'fill: currentColor' gesteuert) -->
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 40 40">
        <path d="M30.3 4.1a14.5 14.5 0 00-6-2.7C20.7 1 17 2 13.6 5.3L7 12.1l-6.9 7 19.8 19.8 8.8-8.9 5-4.9c3-3.1 4.2-6.7 3.8-10a12.9 12.9 0 00-1-3.8l-2 2a10 10 0 01.6 2c.3 2.7-.5 5.4-3.2 8l-4.9 5-16.3-16.4L15.5 7c3-3 5.7-3.6 8.3-3.1 1.6.2 3.2 1 4.7 2z"/>
        <path d="M37.7 1.1l-12.9 13-4.6-4.7-2.3 2.3 6.9 7L40 3.5z"/>
    </svg>

    <span>Mit netID anmelden</span>
</button>
