  <style>
    .custom-auth-button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 290px;
    }

    .custom-btn-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* CSS Variablen */
    .custom-btn-svg {
      --btn-bg-color: #ffffff;
      --btn-border-color: #878786;
      --btn-accent-color: #FFD800;
      --btn-text-color: #333333;
      --btn-logo-color: #000000;
    }

    .btn-bg { fill: var(--btn-bg-color); stroke: var(--btn-border-color); transition: all 0.3s ease; }
    .btn-accent { fill: var(--btn-accent-color); }
    .btn-dark-details { fill: var(--btn-text-color); }
    .btn-logo-letters { fill: var(--btn-logo-color); }
    .btn-text { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: var(--btn-text-color); }

    /* Hover-Effekt */
    .custom-auth-button:hover .btn-bg {
      fill: #f5f5f5;
      stroke: #333333;
    }

    /* Responsivität */
    @media (max-width: 480px) {
      .custom-auth-button {
        max-width: 250px; /* Etwas kleiner auf Handys */
      }
      .btn-text {
        font-size: 12px;
      }
    }
  </style>
